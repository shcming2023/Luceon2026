name: luceon-task34-gate0

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TASK34_GATE0_MINIO_ACCESS:?isolated MinIO access required}
      MINIO_ROOT_PASSWORD: ${TASK34_GATE0_MINIO_SECRET:?isolated MinIO secret required}
    ports: ['39900:9000']
    volumes:
      - ./.uat/task34-gate0/minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing local/eduassets-input local/eduassets-mineru local/eduassets-minerupopo local/eduassets-review;
    environment:
      MINIO_ROOT_USER: ${TASK34_GATE0_MINIO_ACCESS:?isolated MinIO access required}
      MINIO_ROOT_PASSWORD: ${TASK34_GATE0_MINIO_SECRET:?isolated MinIO secret required}

  redis:
    image: redis:7-alpine

  backend:
    image: luceonweb2026-review-backend:rc-5d31514
    command: ['uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8000']
    working_dir: /workspace/backend
    environment:
      DATABASE_URL: sqlite:////candidate/application.db
      REDIS_HOST: redis
      LUCEON_AUTH_DISABLED: 'true'
      LUCEON_PUBLIC_WORKSPACE_USER_ID: '1'
      LUCEON_PUBLIC_WORKSPACE_EMAIL: task34-gate0@luceon.local
      MINIO_ENDPOINT: minio:9000
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:39900
      MINIO_ACCESS_KEY: ${TASK34_GATE0_MINIO_ACCESS:?isolated MinIO access required}
      MINIO_SECRET_KEY: ${TASK34_GATE0_MINIO_SECRET:?isolated MinIO secret required}
      COMPSHARE_LIFECYCLE_ENABLED: 'false'
      TMPDIR: /candidate/upload-tmp
      LUCEON_UPLOAD_TEMP_DIR: /candidate/upload-tmp
      LUCEON_MIN_UPLOAD_TEMP_FREE_BYTES: ${LUCEON_MIN_UPLOAD_TEMP_FREE_BYTES:-1073741824}
      PYTHONPATH: /workspace/backend
    ports: ['39980:8000']
    volumes:
      - ./:/workspace:ro
      - ./.uat/task34-gate0/backend:/candidate
    depends_on: [minio-init, redis]

  frontend:
    build: {context: ./frontend}
    ports: ['39981:80']
    depends_on: [backend]

networks:
  default:
    external: true
    name: luceon-worker-v31-phase-a-uat_default
