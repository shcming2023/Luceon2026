name: luceon-task32-real

services:
  minio:
    container_name: luceon-task32-real-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${TASK32_REAL_MINIO_ACCESS:?set TASK32_REAL_MINIO_ACCESS}
      MINIO_ROOT_PASSWORD: ${TASK32_REAL_MINIO_SECRET:?set TASK32_REAL_MINIO_SECRET}
    ports:
      - '${TASK32_REAL_MINIO_PORT:-19000}:9000'
      - '${TASK32_REAL_MINIO_CONSOLE_PORT:-19001}:9001'
    volumes:
      - ${TASK32_REAL_ROOT:-./.uat/task32-real}/minio:/data

  minio-init:
    container_name: luceon-task32-real-minio-init
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mc alias set local http://luceon-task32-real-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing local/eduassets-input local/eduassets-mineru local/eduassets-minerupopo local/eduassets-parsed;
        exit 0
    environment:
      MINIO_ROOT_USER: ${TASK32_REAL_MINIO_ACCESS}
      MINIO_ROOT_PASSWORD: ${TASK32_REAL_MINIO_SECRET}

  redis:
    container_name: luceon-task32-real-redis
    image: redis:7-alpine
    command: redis-server --appendonly no

  backend:
    container_name: luceon-task32-real-backend
    image: luceonweb2026-review-backend:rc-5d31514
    command: ['uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8000']
    restart: unless-stopped
    working_dir: /workspace/backend
    environment:
      TZ: Asia/Shanghai
      REDIS_HOST: luceon-task32-real-redis
      DATABASE_URL: sqlite:////candidate/application.db
      LUCEON_AUTH_DISABLED: 'false'
      AUTH_SECRET_KEY: task32-real-isolated-auth-secret-not-for-production
      LUCEON_PUBLIC_WORKSPACE_USER_ID: '1'
      LUCEON_PUBLIC_WORKSPACE_EMAIL: task32-real-admin@luceon.local
      LUCEON_PIPELINE_ADMIN_EMAILS: task32-real-control@luceon.local
      MINIO_INTERNAL_ENDPOINT: luceon-task32-real-minio:9000
      MINIO_PUBLIC_ENDPOINT: ${TASK32_REAL_MINIO_PUBLIC_ENDPOINT:-152.136.183.144:19000}
      MINIO_ENDPOINT: luceon-task32-real-minio:9000
      MINIO_ACCESS_KEY: ${TASK32_REAL_MINIO_ACCESS}
      MINIO_SECRET_KEY: ${TASK32_REAL_MINIO_SECRET}
      COMPSHARE_LIFECYCLE_ENABLED: 'true'
      COMPSHARE_API_ENDPOINT: ${COMPSHARE_API_ENDPOINT:-https://api.compshare.cn}
      COMPSHARE_CREDENTIALS_FILE: /run/secrets/compshare_credentials
      COMPSHARE_REGION: ${COMPSHARE_REGION:?runtime region required}
      COMPSHARE_ZONE: ${COMPSHARE_ZONE:?runtime zone required}
      COMPSHARE_PROJECT_ID: ${COMPSHARE_PROJECT_ID:?runtime project required}
      COMPSHARE_UHOST_ID: ${COMPSHARE_UHOST_ID:?runtime instance required}
      GPU_SSH_HOST: ${GPU_SSH_HOST:?runtime SSH host required}
      GPU_SSH_PORT: ${GPU_SSH_PORT:-23}
      GPU_SSH_USER: ${GPU_SSH_USER:-root}
      LUCEON_PIPELINE_SCRIPT: /workspace/backend/scripts/luceon_pdf_pipeline.py
      LUCEON_PIPELINE_WORKDIR: /candidate
      TMPDIR: /candidate/upload-tmp
      LUCEON_UPLOAD_TEMP_DIR: /candidate/upload-tmp
      PYTHONPATH: /workspace/backend
    ports:
      - '${TASK32_REAL_API_PORT:-39780}:8000'
    volumes:
      - ./:/workspace:ro
      - ${TASK32_REAL_ROOT:-./.uat/task32-real}/backend:/candidate
    secrets:
      - compshare_credentials
    depends_on: [minio-init, redis]

  frontend:
    container_name: luceon-task32-real-frontend
    image: luceonweb2026-task31-frontend:local
    ports:
      - '${TASK32_REAL_WEB_PORT:-39781}:80'
    volumes:
      - ./frontend/nginx.task32-real.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend]

networks:
  default:
    external: true
    name: luceon-worker-v31-phase-a-uat_default

secrets:
  compshare_credentials:
    file: ${COMPSHARE_HOST_CREDENTIALS_FILE:?Keychain launcher secret file required}
