name: ${TASK31_UAT_COMPOSE_NAME:-luceon-task31-uat}

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${TASK31_UAT_MINIO_ACCESS:?set TASK31_UAT_MINIO_ACCESS}
      MINIO_ROOT_PASSWORD: ${TASK31_UAT_MINIO_SECRET:?set TASK31_UAT_MINIO_SECRET}
    ports:
      - '${TASK31_UAT_MINIO_PORT:-19100}:9000'
      - '${TASK31_UAT_MINIO_CONSOLE_PORT:-19101}:9001'
    volumes:
      - ${TASK31_UAT_ROOT:-./.uat/task31}/minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing local/eduassets-input local/eduassets-mineru local/eduassets-minerupopo local/eduassets-parsed local/eduassets-raw local/eduassets-clean local/eduassets-standard local/eduassets-elegantbook local/eduassets-review local/eduassets-latex;
        exit 0
    environment:
      MINIO_ROOT_USER: ${TASK31_UAT_MINIO_ACCESS}
      MINIO_ROOT_PASSWORD: ${TASK31_UAT_MINIO_SECRET}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no

  fake-services:
    image: python:3.12-slim
    command: ['python', '/fixture/task31_fake_services.py']
    environment:
      PORT: '8080'
      COMPSHARE_UHOST_ID: uhost-task31-fake
      TASK31_FAKE_EVIDENCE: /evidence/fake-services.jsonl
      TASK31_FAKE_FAIL_STAGE_ONCE: ${TASK31_FAKE_FAIL_STAGE_ONCE:-}
    volumes:
      - ./backend/tests/uat:/fixture:ro
      - ${TASK31_UAT_ROOT:-./.uat/task31}/evidence:/evidence

  backend:
    image: luceonweb2026-review-backend:rc-5d31514
    command: ['uvicorn', 'main:app', '--host', '0.0.0.0', '--port', '8000']
    restart: unless-stopped
    working_dir: /workspace/backend
    environment: &backend_env
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      DATABASE_URL: sqlite:////uat/application.db
      LUCEON_AUTH_DISABLED: 'false'
      AUTH_SECRET_KEY: task31-isolated-auth-secret-not-for-production
      LUCEON_PUBLIC_WORKSPACE_USER_ID: '1'
      LUCEON_PUBLIC_WORKSPACE_EMAIL: task31-admin@luceon.local
      LUCEON_PIPELINE_ADMIN_EMAILS: task31-control@luceon.local
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:${TASK31_UAT_MINIO_PORT:-19100}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${TASK31_UAT_MINIO_ACCESS}
      MINIO_SECRET_KEY: ${TASK31_UAT_MINIO_SECRET}
      GPU_WRAPPER_URL: http://fake-services:8080
      COMPSHARE_LIFECYCLE_ENABLED: 'true'
      COMPSHARE_API_ENDPOINT: http://fake-services:8080
      COMPSHARE_PUBLIC_KEY: ${TASK31_UAT_COMPSHARE_PUBLIC:?set synthetic Task31 public credential}
      COMPSHARE_PRIVATE_KEY: ${TASK31_UAT_COMPSHARE_PRIVATE:?set synthetic Task31 private credential}
      COMPSHARE_ALLOW_LEGACY_ENV: 'true'
      COMPSHARE_REGION: cn-task31
      COMPSHARE_ZONE: cn-task31-01
      COMPSHARE_PROJECT_ID: task31-project
      COMPSHARE_UHOST_ID: uhost-task31-fake
      COMPSHARE_POLL_SECONDS: '1'
      COMPSHARE_OPERATION_TIMEOUT_SECONDS: '30'
      COMPSHARE_STATE_LAG_GRACE_SECONDS: '5'
      COMPSHARE_STATE_LAG_MAX_OBSERVATIONS: '3'
      COMPSHARE_AUTO_STOP: 'true'
      COMPSHARE_STOP_GRACE_SECONDS: '0'
      GPU_SSH_HOST: fake-gpu
      GPU_SSH_PORT: '22'
      GPU_SSH_USER: root
      GPU_SSH_KEY_PATH_IN_CONTAINER: ''
      GPU_SSH_KNOWN_HOSTS_PATH: /fixture/known_hosts
      GPU_REMOTE_SERVICE_ROOT: /srv/mineru
      GPU_MIN_FREE_DISK_BYTES: '1073741824'
      LUCEON_PIPELINE_SCRIPT: /workspace/backend/scripts/luceon_pdf_pipeline.py
      LUCEON_PIPELINE_WORKDIR: /uat
      TMPDIR: /uat/upload-tmp
      LUCEON_UPLOAD_TEMP_DIR: /uat/upload-tmp
      PYTHONPATH: /workspace/backend
      PATH: /fake-bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - '${TASK31_UAT_API_PORT:-39180}:8000'
    volumes:
      - ./:/workspace:ro
      - ${TASK31_UAT_ROOT:-./.uat/task31}/backend:/uat
      - ./backend/tests/uat:/fixture:ro
    depends_on: [minio-init, redis, fake-services]

  material-task-worker:
    image: luceonweb2026-review-backend:rc-5d31514
    command: ['python', 'scripts/material_task_worker.py', '--loop', '--worker-id', 'task31-uat-worker']
    restart: unless-stopped
    working_dir: /workspace/backend
    environment: *backend_env
    volumes:
      - ./:/workspace:ro
      - ${TASK31_UAT_ROOT:-./.uat/task31}/backend:/uat
      - ./backend/tests/uat:/fixture:ro
      - ./backend/tests/uat/task31_fake_ssh:/fake-bin/ssh:ro
    depends_on: [backend]

  frontend:
    build: {context: ./frontend}
    image: luceonweb2026-task31-frontend:local
    ports:
      - '${TASK31_UAT_WEB_PORT:-39181}:80'
    depends_on: [backend]

networks:
  default:
    external: true
    name: luceon-worker-v31-phase-a-uat_default
